    <radialGradient id="glow" cx="600" cy="430" r="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4b860" stop-opacity="0.18"/><stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
