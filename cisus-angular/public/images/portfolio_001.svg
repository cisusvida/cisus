<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101a30"/><stop offset="1" stop-color="#1c2b4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="420" y1="300" x2="780" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7d488"/><stop offset="1" stop-color="#c9962f"/>
