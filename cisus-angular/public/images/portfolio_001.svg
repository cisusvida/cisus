    <path d="M505 375 L600 430 L695 375" fill="none" stroke="#f7e4b5" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <path d="M600 320 c-46 -54 -120 -44 -116 6 4 40 78 36 116 -6 38 42 112 46 116 6 4 -50 -70 -60 -116 -6Z" fill="#f7e4b5" stroke="#caa44e" stroke-width="3"/>
  <circle cx="600" cy="322" r="14" fill="#caa44e"/>
